name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The project record reads every commit and tag.
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting and lint rules
        run: bun run check

      - name: Check site asset versions
        run: bun run --cwd packages/site-runtime stamp --check

      - name: Typecheck workspaces
        run: bun run typecheck

      - name: Run tests
        # One package at a time: each suite already uses every core, and all
        # of them at once made tests that take half a second time out.
        run: bun run test --concurrency=1

      - name: Build workspaces
        run: bun run build
